name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit, integration and end-to-end tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: credisync
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: credisync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U credisync" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      # Integration suites create throwaway databases on this server and skip when it isn't set.
      TEST_DATABASE_ADMIN_URL: postgresql://credisync:ci_password@localhost:5432/credisync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  scorer:
    name: Bank-readiness scorer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/bank-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai/bank-readiness/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          NODE_ENV: test

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build apps and images
    runs-on: ubuntu-latest
    needs: [static, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Build service images
        run: |
          for target in services/api-gateway services/auth services/bureau-ingestion services/dispute-engine services/open-banking packages/jobs packages/migrations; do
            docker build --build-arg TARGET="$target" -t "credisync/$(basename "$target"):ci" .
          done
          docker build -t credisync/bank-readiness:ci ai/bank-readiness
