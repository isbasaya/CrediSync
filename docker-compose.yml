# Local development stack. Everything runs with synthetic (sandbox) bureau
# and bank data — no real credentials or personal information.
#
#   docker compose up --build            # API on http://localhost:4000/api
#   docker compose run --rm jobs all     # run the scheduled jobs once
#
# Only the gateway is published to the host; internal services are reachable
# only on the compose network, as in production. The web and admin apps run
# with `npm run dev -w web` / `npm run dev -w admin`.

x-node-env: &node-env
  NODE_ENV: development
  DATABASE_URL: postgresql://credisync_service:credisync_service_dev@postgres:5432/credisync
  INTERNAL_SERVICE_TOKEN: credisync-dev-internal-token-not-for-production
  JWT_SECRET: credisync-dev-jwt-secret-not-for-production-use
  ENCRYPTION_MASTER_KEY: 6f1c2b8f5d3e4a7b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
  HMAC_KEY: credisync-dev-hmac-key-do-not-use-outside-development
  WEB_APP_URL: http://localhost:3000

# Local S3 for dispute evidence (dev-only values, never reused outside this file).
# KMS_KEY_ID is deliberately unset: it would also switch field encryption to real AWS KMS,
# and MinIO has no KMS. The storage provider accepts a local endpoint without it.
x-evidence-env: &evidence-env
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  EVIDENCE_BUCKET: credisync-evidence-dev
  AWS_REGION: af-south-1
  AWS_ACCESS_KEY_ID: credisync-minio-dev
  AWS_SECRET_ACCESS_KEY: credisync-minio-dev-secret-not-for-production

# Docker Hub no longer serves MinIO release tags, so the image is pinned by digest
# (RELEASE.2025-09-07T16-13-09Z, which also ships the `mc` client used by minio-init).
x-minio-image: &minio-image minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: credisync
      POSTGRES_USER: credisync # schema owner (used only by migrations)
      POSTGRES_PASSWORD: credisync_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/dev/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U credisync -d credisync']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  # S3-compatible store for evidence uploads. Only the S3 API is published (to
  # localhost, so presigned URLs work from a browser); the console is not.
  minio:
    image: *minio-image
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: credisync-minio-dev
      MINIO_ROOT_PASSWORD: credisync-minio-dev-secret-not-for-production
      MINIO_REGION: af-south-1
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: *minio-image
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/credisync-evidence-dev
    environment:
      MINIO_ROOT_USER: credisync-minio-dev
      MINIO_ROOT_PASSWORD: credisync-minio-dev-secret-not-for-production
    depends_on:
      minio: { condition: service_healthy }

  migrate:
    build: { context: ., args: { TARGET: packages/migrations } }
    command: ['node', 'packages/migrations/dist/runner.js', 'up']
    environment:
      MIGRATION_DATABASE_URL: postgresql://credisync:credisync_dev@postgres:5432/credisync
    depends_on:
      postgres: { condition: service_healthy }

  auth:
    build: { context: ., args: { TARGET: services/auth } }
    environment: { <<: *node-env, PORT: '4004' }
    depends_on:
      migrate: { condition: service_completed_successfully }

  bureau-ingestion:
    build: { context: ., args: { TARGET: services/bureau-ingestion } }
    environment: { <<: *node-env, PORT: '4001', BUREAU_MODE: sandbox }
    depends_on:
      migrate: { condition: service_completed_successfully }

  dispute-engine:
    build: { context: ., args: { TARGET: services/dispute-engine } }
    environment:
      <<: [*node-env, *evidence-env]
      PORT: '4002'
      DISPUTE_SUBMISSION_CHANNEL: manual
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  open-banking:
    build: { context: ., args: { TARGET: services/open-banking } }
    environment:
      <<: *node-env
      PORT: '4003'
      OPEN_BANKING_MODE: sandbox
      STITCH_REDIRECT_URI: http://localhost:3000/bank/callback
    depends_on:
      migrate: { condition: service_completed_successfully }

  bank-readiness:
    build: { context: ai/bank-readiness }
    environment:
      NODE_ENV: development
      INTERNAL_SERVICE_TOKEN: credisync-dev-internal-token-not-for-production

  api-gateway:
    build: { context: ., args: { TARGET: services/api-gateway } }
    ports:
      - '4000:4000'
    environment:
      <<: *node-env
      PORT: '4000'
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:4004
      BUREAU_INGESTION_URL: http://bureau-ingestion:4001
      DISPUTE_ENGINE_URL: http://dispute-engine:4002
      OPEN_BANKING_URL: http://open-banking:4003
      BANK_READINESS_URL: http://bank-readiness:8000
    depends_on:
      - redis
      - auth
      - bureau-ingestion
      - dispute-engine
      - open-banking
      - bank-readiness

  jobs:
    build: { context: ., args: { TARGET: packages/jobs } }
    entrypoint: ['node', 'packages/jobs/dist/runner.js']
    command: ['all']
    environment: { <<: [*node-env, *evidence-env] }
    profiles: ['jobs']
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
